<script src="config.js"></script>
<script>
const SYSTEM_PROMPT = `You are a world-class science communicator and creative coder. Given a concept, you build ONE complete HTML document: an "explorable explanation" in the spirit of Distill.pub, Bartosz Ciechanowski and Nicky Case. It must feel like a beautiful, hand-crafted interactive article that someone would share, not a small widget.

PAGE STRUCTURE (all sections required, in this order, each a <section class="section">):
1. Hero: an .eyebrow label, a big <h1>, a one-line hook that makes people curious, and a large centerpiece visualization that is ALREADY ANIMATING on page load with no interaction needed. This is the first thing the audience sees: make it gorgeous (motion, glow, particles, depth).
2. The big idea: 3 to 5 short paragraphs building real intuition, plus one concrete everyday analogy in a .callout.
3. The lab: the main interactive simulation. At least 3 controls (sliders, toggles, draggable points), live numeric .readout values, play/pause and reset buttons, and 3 to 4 preset .chip buttons ("Try: resonance", "Try: zero gravity") that jump to the most interesting states. Labeled axes and units where relevant.
4. Step by step: 3 to 5 numbered .card steps that walk through how it works. Each step has its own small animated or interactive diagram, or a button that drives the lab into that state.
5. The math: the key formula(s) in LaTeX, with each variable explained, and a live line that plugs in the current slider values. Skip only if the concept has no math at all, and replace it with a "by the numbers" section of striking facts.
6. What surprises people: 2 to 3 common misconceptions, each with the correct picture.
7. In the real world: 3 concrete applications or examples as .card items.
8. Quick check: 3 multiple-choice questions in a .quiz block, with instant right/wrong feedback and a one-sentence explanation after each answer.

PICK THE RIGHT MEDIUM for the centerpiece and lab:
- 3D things (molecules, orbits, geometry, fields, anatomy): Three.js with OrbitControls.
- Mechanics, collisions, springs, stacking: Matter.js, or your own integrator on canvas.
- Networks, trees, graphs, data, timelines: D3 with SVG.
- Diffusion, gases, crowds, populations, waves: canvas particle systems.
- Processes, cycles, diagrams: animated SVG.
- Generative, biological, artistic: p5.js.

AVAILABLE LIBRARIES (load with a plain <script src> tag using EXACTLY these URLs; use at most 2; plain canvas/SVG is fine when it fits better):
- Three.js (global THREE): https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js
- OrbitControls (THREE.OrbitControls, load after Three.js): https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js
- D3 (global d3): https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js
- p5.js (global mode or instance mode): https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js
- Matter.js (global Matter): https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js
- GSAP (global gsap): https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js
- Chart.js (global Chart): https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js
No other external resources, no ES module imports, no fetch or XHR.

DESIGN KIT (already injected into the page for you; do NOT redefine it, build on it):
- Dark theme. CSS variables: --bg, --panel, --panel-2, --line, --ink, --muted, --accent (cyan), --accent-2 (violet), --accent-3 (amber), --good (green), --bad (red), --radius, --serif, --sans, --mono. Use these variables for every color so the page stays coherent.
- Classes: .section (centered column with generous spacing), .hero (taller first section), .eyebrow (small uppercase label), .lede (large intro text), .card, .grid (responsive card grid), .callout, .btn and .btn.primary, .chip, .controls (control panel layout), .control (label + input + readout row), .readout (monospace live value), .stage (framed area for a canvas/svg; give it a height), .quiz, .option, .option.correct, .option.wrong, .feedback.
- Headings use the serif display font automatically. Range inputs, buttons and selects are already styled.
- KaTeX is loaded and auto-renders on page load: write inline math as \\( ... \\) and display math as $$ ... $$ in the HTML. For math you update from JavaScript, call katex.render(texString, element).

ENGINEERING RULES:
- Put your own JavaScript in ONE <script> at the end of <body>. Declare ALL constants, state variables and functions first; start animation loops and event wiring only at the very bottom, after everything they touch is defined. A "Cannot access X before initialization" error leaves a blank canvas, which is the worst possible outcome.
- Give each visual (hero, lab, each step diagram) its own init function, and call each one inside try { ... } catch (e) { console.error(e) }, so a bug in one can never blank the rest of the page.
- Do not load KaTeX or fonts yourself; they are already on the page.
- Animate with requestAnimationFrame. Canvases must scale by devicePixelRatio and redraw on resize. Size visuals to their container so it works from phone width to a wide projector.
- Every control, preset and quiz option must actually work. No placeholders, no TODOs, no lorem ipsum, no "simplified for brevity".
- Never use localStorage, sessionStorage, cookies, alert, prompt or confirm: the page runs in a sandboxed iframe where they throw.
- Use vivid, high-contrast colors on the dark background; label everything the viewer needs to read.

Be ambitious: expect 600 to 1200 lines. Do not abbreviate the code. Return ONLY the raw HTML, starting with <!DOCTYPE html> and ending with </html>. No markdown fences, no commentary.`;
const PHOTO_PROMPT = "Bring this photo to life. Work out what it shows (a hand-drawn sketch, diagram, formula, chart, or textbook page) and build the full explorable page about exactly that. The hero centerpiece and the lab must recreate the photo's objects, layout and labels recognizably, then make them move and respond to the controls. Open the big idea section by saying what you see in the photo.";
const SIMPLER = "Make it simpler: write for a curious 12-year-old. Keep every section, but use plain words, short sentences, bigger visuals, at most 2 controls in the lab, and no heavy math (show the formula in words instead).";
const DEFAULT_MODEL = "gemini-flash-latest";
const CACHE_VERSION = "v2";

// Shared design kit injected into every generated page, so even plain output looks polished.
const KIT = `
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"><\/script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"><\/script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  try {
    renderMathInElement(document.body, {
      delimiters: [
        { left: "$$", right: "$$", display: true },
        { left: "\\\\[", right: "\\\\]", display: true },
        { left: "\\\\(", right: "\\\\)", display: false }
      ],
      throwOnError: false
    });
  } catch {}
});
<\/script>
<style>

    --ink: #e8ecf8; --muted: #94a0bf;
    --accent: #22d3ee; --accent-2: #a78bfa; --accent-3: #fbbf24; --good: #34d399; --bad: #f87171;
    --radius: 18px;
    --serif: "Instrument Serif", Georgia, serif;
    --sans: "Geist", system-ui, sans-serif;
    --mono: "Geist Mono", ui-monospace, monospace;
  }
  *, *::before, *::after { box-sizing: border-box; }

    margin: 0; color: var(--ink); font: 17px/1.7 var(--sans); -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(34, 211, 238, 0.12), transparent 60%),
      radial-gradient(900px 500px at 100% 10%, rgba(167, 139, 250, 0.12), transparent 60%),
      var(--bg);
    background-attachment: fixed;
  }
  h1, h2, h3 { font-family: var(--serif); font-weight: 400; line-height: 1.05; letter-spacing: -0.01em; margin: 0 0 0.5em; }
  h1 { font-size: clamp(44px, 8vw, 88px); }
  h2 { font-size: clamp(32px, 5vw, 52px); }
  h3 { font-size: clamp(22px, 3vw, 28px); }
  h1 em, h2 em { color: var(--accent); }
  p { margin: 0 0 1em; }
  a { color: var(--accent); }
  strong { color: #fff; }
  .section { max-width: 1040px; margin: 0 auto; padding: clamp(48px, 8vw, 96px) 20px; }
  .section + .section { border-top: 1px solid var(--line); }

  .callout { border-left: 3px solid var(--accent-2); background: rgba(167, 139, 250, 0.08); border-radius: 0 var(--radius) var(--radius) 0; padding: 18px 22px; margin: 24px 0; }
  .stage { position: relative; width: 100%; min-height: 320px; border: 1px solid var(--line); border-radius: var(--radius); background: rgba(5, 8, 18, 0.7); overflow: hidden; }
  .stage canvas, .stage svg { display: block; width: 100%; height: 100%; }

  .control { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; font-size: 14px; color: var(--muted); }

  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px rgba(34, 211, 238, 0.2); cursor: pointer; }

const MAX_PHOTO_SIDE = 1280;

const $ = id => document.getElementById(id);
const store = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
const load = k => { try { return localStorage.getItem(k); } catch { return null; } };

// A key in config.js (optional, gitignored) wins over one saved in the browser.
$("model").value = load("gemini-model") || DEFAULT_MODEL;
if (!$("model").value) $("model").value = DEFAULT_MODEL;
$("model").addEventListener("change", e => store("gemini-model", e.target.value));

let last = { concept: "", photo: null, simpler: false };
let requestId = 0;
let controller;
let stream;

// Finished pages are cached per concept (or per photo) so repeat runs load instantly.
async function cacheKey({ concept, photo, simpler }) {
  let id = concept.toLowerCase();
  if (photo) {
    const hash = new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(photo)));
    id = "photo:" + [...hash.slice(0, 8)].map(b => b.toString(16).padStart(2, "0")).join("");
  }
  return `viz:${CACHE_VERSION}:${simpler ? "simple:" : ""}${id}`;
}

// Drop markdown fences and anything before the document starts or after it ends.
function clean(text) {
  let s = text.replace(/```(?:html)?/gi, "");
  const i = s.search(/<!DOCTYPE html|<html/i);
  if (i >= 0) s = s.slice(i);
  const end = s.toLowerCase().lastIndexOf("</html>");
  if (end >= 0) s = s.slice(0, end + "</html>".length);
  return s.trim();
}

// Put the design kit at the top of <head>, before the page's own styles and scripts.
function enhance(html) {
  if (/<head[^>]*>/i.test(html)) return html.replace(/<head[^>]*>/i, m => m + KIT);
  if (/<html[^>]*>/i.test(html)) return html.replace(/<html[^>]*>/i, m => `${m}<head>${KIT}</head>`);
  return KIT + html;
}

function showError(msg) {
  $("errorMsg").textContent = msg;
  $("error").hidden = false;
}

function render(html) {
  $("frame").srcdoc = enhance(html);
  $("actions").hidden = false;
}

// Scale an image or video frame down and encode it as a JPEG data URL.
function toJpeg(source, width, height) {
  const scale = Math.min(1, MAX_PHOTO_SIDE / Math.max(width, height));
  const canvas = document.createElement("canvas");
  canvas.width = Math.round(width * scale);
  canvas.height = Math.round(height * scale);
  canvas.getContext("2d").drawImage(source, 0, 0, canvas.width, canvas.height);
  return canvas.toDataURL("image/jpeg", 0.85);
}

async function openCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: { ideal: 1280 } } });
    $("video").srcObject = stream;
    $("error").hidden = true;
    $("camera").hidden = false;
  } catch (err) {
    showError(`Couldn't open the camera: ${err.message}`);
  }
}

function closeCamera() {
  stream?.getTracks().forEach(track => track.stop());
  stream = null;
  $("camera").hidden = true;
}

function runPhoto(photo) {
  $("concept").value = "";
  run({ photo });
}

// Read Gemini's server-sent events, passing the text so far to onText
// and the latest thought-summary heading (while the model thinks) to onThought.
async function readStream(res, onText, onThought) {
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = "", text = "", thoughts = "", finishReason;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    const lines = buffer.split("\n");
    buffer = lines.pop();
    for (const line of lines) {
      if (!line.startsWith("data:")) continue;
      const chunk = JSON.parse(line.slice(5));
      if (chunk.error) throw new Error(chunk.error.message);
      const candidate = chunk.candidates?.[0];
      const parts = candidate?.content?.parts || [];
      text += parts.filter(p => !p.thought).map(p => p.text || "").join("");
      thoughts += parts.filter(p => p.thought).map(p => p.text || "").join("");
      finishReason = candidate?.finishReason || finishReason;
    }
    const heading = [...thoughts.matchAll(/\*\*(.+?)\*\*/g)].pop()?.[1];
    if (heading && !text) onThought(heading);
    onText(text);
  }
  return { text, finishReason };
}

async function run({ concept = "", photo = null, simpler = false, fresh = false }) {
  concept = concept.trim();
  if (!concept && !photo) return;
  last = { concept, photo, simpler };
  const id = ++requestId;
  controller?.abort();
  closeCamera();
  $("error").hidden = true;
  $("actions").hidden = true;
  $("loading").hidden = true;
  $("frame").srcdoc = "";

  const cacheId = await cacheKey(last);
  if (id !== requestId) return;
  const cached = !fresh && load(cacheId);
  if (cached) return render(cached);

  const key = (window.GEMINI_API_KEY || "").trim();
  const model = $("model").value.trim() || DEFAULT_MODEL;
  if (!key) return showError("Missing Gemini API key.\nAdd it to config.js, then reload and try again.");

  const parts = [{ text: (photo ? PHOTO_PROMPT : `Concept: ${concept}`) + (simpler ? `\n\n${SIMPLER}` : "") }];
  if (photo) parts.unshift({ inlineData: { mimeType: "image/jpeg", data: photo.split(",")[1] } });

  controller = new AbortController();
  $("code").textContent = "";
  $("status").textContent = photo ? "Bringing your photo to life..." : "Thinking about how to explain it...";
  $("loading").style.backgroundImage = photo ? `linear-gradient(var(--scrim), var(--scrim-strong)), url("${photo}")` : "";
  $("loading").hidden = false;
  const started = Date.now();
  $("elapsed").textContent = "0s";
  const timer = setInterval(() => { $("elapsed").textContent = `${Math.round((Date.now() - started) / 1000)}s`; }, 1000);
  try {
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:streamGenerateContent?alt=sse`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-goog-api-key": key },
      signal: controller.signal,
      body: JSON.stringify({
        systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },
        contents: [{ role: "user", parts }],
        generationConfig: { maxOutputTokens: 65536, thinkingConfig: { thinkingLevel: "high", includeThoughts: true } }
      })
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      console.log("Gemini error response:", data);
      throw new Error(data.error?.message || `Request failed with status ${res.status}.`);
    }

    const { text, finishReason } = await readStream(res, soFar => {
      if (!soFar) return;
      $("status").textContent = `Writing the page... ${soFar.split("\n").length} lines`;
      $("code").textContent = soFar;
      $("code").scrollTop = $("code").scrollHeight;
    }, heading => {
      $("status").textContent = `${heading}...`;
    });
    console.log("Gemini raw response:", text);
    if (!text.trim()) throw new Error(`The model returned an empty response${finishReason ? ` (finishReason: ${finishReason})` : ""}.`);
    if (finishReason === "MAX_TOKENS") throw new Error("The page was cut off before it finished. Try again.");

    const html = clean(text);
    console.log("Cleaned HTML:", html);
    store(cacheId, html);
    render(html);
  } catch (err) {
    if (id === requestId) showError(err.message);
  } finally {
    clearInterval(timer);
    if (id === requestId) $("loading").hidden = true;
  }
}

$("form").addEventListener("submit", e => { e.preventDefault(); run({ concept: $("concept").value }); });
$("regen").addEventListener("click", () => run({ ...last, fresh: true }));
$("simpler").addEventListener("click", () => run({ ...last, simpler: true }));
$("retry").addEventListener("click", () => { $("error").hidden = true; run(last); });

$("cameraBtn").addEventListener("click", openCamera);
$("cancelCamera").addEventListener("click", closeCamera);
$("snap").addEventListener("click", () => {
  const video = $("video");
  runPhoto(toJpeg(video, video.videoWidth, video.videoHeight));
});
$("uploadBtn").addEventListener("click", () => $("file").click());
$("file").addEventListener("change", () => {
  const file = $("file").files[0];
  $("file").value = "";
  if (!file) return;
  const img = new Image();
  img.onload = () => {
    URL.revokeObjectURL(img.src);
    runPhoto(toJpeg(img, img.naturalWidth, img.naturalHeight));
  };
  img.onerror = () => showError("Couldn't read that image file.");
  img.src = URL.createObjectURL(file);
});
</script>
</body>
